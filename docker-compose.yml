# Postgres credentials below are ${VAR}-interpolated from backend/.env, not
# hardcoded here. Compose only auto-loads a .env from the project root, not
# backend/.env, so run compose with an explicit --env-file to make backend/.env
# control them (the `backend` service also loads backend/.env directly via its
# own `env_file:` entry below, independent of this flag):
#   docker compose --env-file backend/.env build
#   docker compose --env-file backend/.env up
# Without --env-file, each ${VAR:-default} falls back to the same dev-only
# values backend/.env.example ships, so compose still works — it just won't
# be reading your customized credentials.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-realestate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realestate-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-realestate}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realestate} -d ${POSTGRES_DB:-realestate}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Consumed by app/core/revocation.py: backs POST /auth/logout's JWT denylist
    # (RedisTokenDenylist), so a logged-out token is invalidated immediately rather
    # than just expiring naturally. Not a hard dependency for the rest of the app —
    # the denylist client connects lazily and revocation checks fail open if this
    # service is unreachable (see revocation.py's module docstring for the
    # fail-open-vs-fail-closed reasoning).

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      # Overrides backend/.env's SQLite default (sqlite:///./app.db) for the
      # containerized environment. Non-Docker local dev (`uv run uvicorn`)
      # still defaults to SQLite via backend/.env.example — this override is
      # compose-only. Built from the same POSTGRES_* vars as the postgres
      # service above (see the --env-file note at the top of this file), so
      # credentials only ever need to change in backend/.env. NOT YET
      # CONSUMED: app/db/session.py (task B4, Phase 1) is what actually opens
      # a connection; the driver (psycopg, added to backend/pyproject.toml)
      # is installed ahead of that landing. Adjust the +psycopg dialect here
      # if Phase 1 picks a different driver (e.g. +asyncpg for an async
      # engine).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-realestate}:${POSTGRES_PASSWORD:-realestate-dev-only}@postgres:5432/${POSTGRES_DB:-realestate}
      # Consumed by app/core/config.py:Settings.redis_url, which app/main.py uses to
      # build the POST /auth/logout token-revocation denylist (see the redis service
      # note above).
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/admin
      dockerfile: ../../infra/frontend/Dockerfile
      args:
        # Same-origin relative path, not http://backend:8000/api/v1: VITE_API_BASE_URL
        # is inlined into the browser-side bundle at build time, and the 'backend'
        # hostname only resolves inside this Compose network, never inside the actual
        # browser. nginx (frontend/admin/nginx.conf) is what proxies this path to the
        # backend service server-to-server, where 'backend' does resolve.
        VITE_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped
    # Because API calls are same-origin through nginx's proxy rather than a direct
    # cross-origin browser fetch, backend/.env's CORS_ALLOWED_ORIGINS does not need
    # this container's origin added for this path to work — CORS only ever governs
    # requests the browser sees as cross-origin.

volumes:
  postgres_data:
