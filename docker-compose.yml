services:
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/backend/Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # frontend: the admin SPA (frontend/admin, Vite + React) gets its own service here
  # once task F1 scaffolds it — build context ./frontend/admin, served on 5173 in dev,
  # and CORS_ALLOWED_ORIGINS in backend/.env must list its origin explicitly ('*' is
  # rejected at config validation because cookie auth is credentialed).

# NOTE: no volumes yet. B4 introduces the SQLite database at DATABASE_URL and will
# need a named volume for it so data survives `docker compose down`.
