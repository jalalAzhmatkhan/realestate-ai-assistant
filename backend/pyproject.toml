[project]
name = "realestate-ai-assistant"
version = "0.1.0"
description = "Agentic AI assistant backend for real estate management"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.2",
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32",
    # Postgres driver for docker-compose's DATABASE_URL. Consumed by
    # app/db/session.py's sync engine (SQLAlchemy's postgresql+psycopg dialect).
    "psycopg[binary]>=3.2",
    # Sync client (matches the rest of this codebase's sync SQLModel/FastAPI
    # dependencies). Backs app/core/revocation.py's POST /auth/logout JWT denylist.
    "redis>=5.0",
]

[dependency-groups]
dev = [
    # In-memory Redis-protocol server for exercising app/core/revocation.py without
    # a real Redis instance (this environment has none). QA decides separately
    # whether the full test suite keeps using this or a real Redis fixture.
    "fakeredis>=2.37.0",
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
