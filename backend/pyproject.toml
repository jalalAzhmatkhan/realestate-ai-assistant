[project]
name = "realestate-ai-assistant"
version = "0.1.0"
description = "Agentic AI assistant backend for real estate management"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.32",
    # Postgres driver for docker-compose's DATABASE_URL. Not yet consumed by
    # any code — app/db/session.py (task B4, Phase 1) is what actually opens
    # a connection. Added now so the Docker image builds against the driver
    # the compose environment expects; may change if Phase 1 picks a
    # different driver (e.g. asyncpg for an async engine).
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
