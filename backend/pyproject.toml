[project]
name = "realestate-ai-assistant"
version = "0.1.0"
description = "Agentic AI assistant backend for real estate management"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "bcrypt>=4.2",
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32",
    # Postgres driver for docker-compose's DATABASE_URL. Consumed by
    # app/db/session.py's sync engine (SQLAlchemy's postgresql+psycopg dialect)
    # and by alembic/env.py for the same connection string.
    "psycopg[binary]>=3.2",
    # Sync client (matches the rest of this codebase's sync SQLModel/FastAPI
    # dependencies). Backs app/core/revocation.py's POST /auth/logout JWT denylist.
    "redis>=5.0",
    # `-slim` rather than the `pydantic-ai` meta-package: that one pulls in every
    # provider plus optional extras (CLI, MCP, evals, duckduckgo/tavily search tools)
    # this service has no use for. The three extras are exactly the values
    # LLM_PROVIDER accepts, and `google` (not the deprecated `gemini`) is the current
    # extra backing GoogleModel/GoogleEmbeddingModel.
    "pydantic-ai-slim[anthropic,google,openai]>=1.0",
    # Backs app/rag/index.py's flat cosine index.
    "numpy>=2.4.6",
    # EMBEDDING_PROVIDER=local, the zero-API-key default, so FAQ search works with no
    # credentials at all. Heavy (pulls torch) but it is the only way the documented
    # "runs fully offline out of the box" claim is true; deployments that set
    # EMBEDDING_PROVIDER=openai/gemini never import it (app/rag/embeddings.py imports
    # each backend lazily). Model weights are fetched from Hugging Face on first use
    # and cached thereafter.
    "sentence-transformers>=3.0",
    # Direct (not just transitive via sentence-transformers): uv's [tool.uv.sources]
    # override below only applies to a package listed as a direct dependency here.
    "torch>=2.0",
]

[dependency-groups]
dev = [
    # In-memory Redis-protocol server for exercising app/core/revocation.py without
    # a real Redis instance (this environment has none). QA decides separately
    # whether the full test suite keeps using this or a real Redis fixture.
    "fakeredis>=2.37.0",
    "httpx>=0.27",
    "pytest>=8.3",
]

# sentence-transformers pulls torch, and PyPI's default Linux wheel for torch bundles
# the full CUDA/cuDNN/cuBLAS runtime (several GB) even though this container has no
# GPU and never will. Redirecting torch to PyTorch's own CPU-only wheel index avoids
# downloading or installing any of that — same API, a fraction of the size. Harmless
# on Windows/macOS dev machines too: those platforms don't have a CUDA wheel variant
# in the first place, so uv resolves the regular PyPI wheel there regardless.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
