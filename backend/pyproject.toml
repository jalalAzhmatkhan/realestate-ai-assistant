[project]
name = "realestate-ai-assistant"
version = "0.1.0"
description = "Agentic AI assistant backend for real estate management"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "bcrypt>=4.2",
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32",
    # Postgres driver for docker-compose's DATABASE_URL. Consumed by
    # app/db/session.py's sync engine (SQLAlchemy's postgresql+psycopg dialect)
    # and by alembic/env.py for the same connection string.
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
