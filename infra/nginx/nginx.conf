server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxied rather than left for the browser to call directly: this keeps
    # every API call same-origin from the browser's point of view, so the SameSite=Strict
    # session cookie (backend/app/api/auth.py) is sent without any CORS configuration,
    # and the frontend's VITE_API_BASE_URL can stay a relative path baked into its build
    # (see ../frontend/Dockerfile) instead of the 'backend' hostname, which only resolves
    # inside the Compose network and never inside the user's browser.
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: react-router's client-side routes are not real files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
